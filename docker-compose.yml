services:
  api-ml:
    build:
      context: .
      dockerfile: api_ml/Dockerfile
    image: conferencia-de-lotes-ml-api:local
    environment:
      ML_MODEL_PATH: /app/models/classificador_lotes.pkl
    ports:
      - "${ML_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  conferencia-de-lotes:
    build:
      context: .
      dockerfile: Dockerfile
    image: conferencia-de-lotes:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      MAESTRO_ENABLED: "false"
      VAULT_ENABLED: "false"
      HOME: /tmp
      ENVIRONMENT: container
      TZ: America/Manaus
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BOT_ID: bot-conferencia-de-lotes-v2
      EXECUTION_ID: docker-compose-local
      INPUT_DIR: dados_entrada
      INPUT_CSV: dados_entrada/lotes_auditoria.csv
      LOG_FILE: logs/execucao.log
      REPORT_DIR: relatorios
      WEB_AUTOMATION_ENABLED: "${WEB_AUTOMATION_ENABLED:-false}"
      WEB_TEST_URL: web/index-lotes/index.html
      WEB_ARTIFACT_DIR: artefatos
      WEB_TIMEOUT_SECONDS: "${WEB_TIMEOUT_SECONDS:-15}"
      ML_ENABLED: "${ML_ENABLED:-false}"
      ML_API_URL: http://api-ml:8000
      ML_TIMEOUT_SECONDS: "${ML_TIMEOUT_SECONDS:-3}"
      ML_CONFIANCA_MINIMA: "${ML_CONFIANCA_MINIMA:-0.85}"
      REFERENCE_MAX_ATTEMPTS: "${REFERENCE_MAX_ATTEMPTS:-3}"
      REFERENCE_RETRY_BASE_INTERVAL_SECONDS: "${REFERENCE_RETRY_BASE_INTERVAL_SECONDS:-1}"
      REFERENCE_TIMEOUT_SECONDS: "${REFERENCE_TIMEOUT_SECONDS:-5}"
      DEAD_LETTER_PATH: data/output/dead_letter.jsonl
      PROCESSING_DELAY_SECONDS: "0"
    volumes:
      - ./dados_entrada:/app/dados_entrada:ro
      - ./logs:/app/logs
      - ./relatorios:/app/relatorios
      - ./artefatos:/app/artefatos
      - ./data/output:/app/data/output
