name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q

  docker:
    name: Validar imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build --tag conferencia-de-lotes:ci .

      - name: Executar smoke test Playwright
        run: >-
          docker run --rm --shm-size=1g
          --env MAESTRO_ENABLED=false
          --env VAULT_ENABLED=false
          --env WEB_AUTOMATION_ENABLED=true
          --env PROCESSING_DELAY_SECONDS=0
          --env REFERENCE_LOTES=L001,L002
          conferencia-de-lotes:ci
