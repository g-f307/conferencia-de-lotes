[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    unit: testes rapidos e isolados de unidades de codigo
    integration: testes de colaboracao entre modulos e recursos locais
    regression: testes que protegem comportamentos corrigidos ou regras criticas
    e2e: testes controlados do fluxo completo da aplicacao
    browser: testes que exigem navegador Playwright real
